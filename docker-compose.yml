services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payhub
      POSTGRES_PASSWORD: payhub
      POSTGRES_DB: payhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://payhub:payhub@postgres:5432/payhub?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-jwt-secret-change-before-production-32chars
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000,http://localhost:8080
      DEMO_API_SECRET: local-demo-api-secret-change-before-production
      PORT: 4000
      API_PORT: 4000
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        API_BASE_URL: http://api:4000
    environment:
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    ports:
      - "8080:80"

volumes:
  postgres_data:
